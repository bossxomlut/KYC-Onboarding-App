services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "log_min_messages=fatal", "-c", "log_statement=none"]
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: kyc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kyc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  kyc-postgres:
